# memfo -- packaging, the test gate and the release gate
# =======================================================
#
# Sources of truth
# ----------------
# * Build backend: flit_core.  The release number lives in
#   `memfo/__init__.py:__version__` only; never add `version =` to
#   [project].  tests/test_bless.py pins that the gate reads this one place.
# * Layout: the package is `memfo/` at the root and `memfo` is the first
#   console script (memfo.main:run).  `./runner` runs the same tree straight
#   from source under `.venv/bin/python` for debugging, without installing
#   anything or taking over `~/.local/bin`.
#
# The gates
# ---------
# CI and `./bless` run the same three commands, on the interpreter that holds
# the dev extra:
#
#   python -m ruff check .
#   python -m compileall -q memfo tests
#   python -m pytest -q --cov=memfo --cov-report=term-missing
#
# The toolchain lives in the checkout's virtualenv, which is also the
# interpreter `./bless` must run under.  Build it with `bt`, which installs
# this package editable plus the `dev` extra and the gate's tool floors:
#
#   bt penv            # rebuilds .venv around the tree
#   .venv/bin/python ./bless
#
# Releasing
# ---------
# `./bless` is the only path to an upload and it takes no argument and no
# flag: every run runs the whole gate, prints what it is holding, and only
# then asks `====> Enter test or publish or quit:`.  See tests/README-DEV.md
# for the stages, the credentials and the release checklist, and
# ../../blessd/docs/release-strategy.md for the strategy every project shares.

[build-system]
# 3.12 is the first flit_core release that understands the PEP 639 `license`
# expression and `license-files` keys used in the `[project]` table below.
# The upper bound matters: flit_core 4.x writes Metadata 2.5, which only
# twine >= 7 and packaging >= 26 accept -- exactly the floors the `dev` extra
# and `./bless` declare.
requires = ["flit_core>=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "memfo"
# The release number lives in `memfo/__init__.py` (`__version__`).  This
# table only declares where it comes from, so `bless`, the built artifacts
# and `memfo --version` all report the same string.
dynamic = ["version"]
description = "Display Tool for /proc/meminfo"
authors = [
    { name = "Joe Defen", email = "joedef@duck.com" }
]
readme = "README.md"
# PEP 639: an SPDX expression plus the file it refers to.  The old
# `License :: OSI Approved :: MIT License` classifier is deliberately gone --
# Metadata 2.4 and later carry License-Expression, and declaring both invites
# them to disagree.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["meminfo", "/proc/meminfo", "RAM", "memory statistics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    'console-window == 2.2.2',
]

[project.optional-dependencies]
# The minimum a contributor needs to run the suite (what CI installs on every
# supported Python).
test = [
    'pytest >= 7.0',
    'pytest-cov >= 4.0',
]
# The release toolchain.  `./bless` refuses to start unless `twine` and
# `packaging` meet its own floors (`twine>=7`, `packaging>=26`), so declaring
# the same floors here means the extra always installs a toolchain the release
# gate accepts.
dev = [
    'pytest >= 7.0',
    'pytest-cov >= 4.0',
    'ruff >= 0.9',
    'build >= 1.2',
    'twine >= 7',
    'packaging >= 26',
]

[project.scripts]
memfo = "memfo.main:run"
memfod = "memfo.memfod:main"

[project.urls]
"Homepage" = "https://github.com/joedefen/memfo"
"Bug Tracker" = "https://github.com/joedefen/memfo/issues"

[tool.bless]
# The branch model `./bless` keeps.  `["main"]` releases from the trunk alone;
# `["main", "dev"]` -- the default when this table says nothing -- requires a
# `dev` branch both locally and on origin, and fast-forwards whichever of the
# two lags onto the other before tagging.  This project releases from `main`
# only, so a small change can be published without creating and pushing `dev`
# first.  The cost is explicit: with one branch, `bless` cannot tell you that
# `dev` was left behind, so merging it back stays the maintainer's job.
branches = ["main"]

# The rest is derived rather than written here: the distribution name comes
# from `[project] name` ("memfo"), the package holding `__version__` from that
# name with `-` and `.` turned into `_` ("memfo"), the console script from the
# first `[project.scripts]` entry ("memfo") and the inspector from
# `tests/inspect_dist.py`.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Keep Ruff deterministic instead of inheriting a developer's global
# configuration: the gate CI runs and the gate `./bless` runs have to be the
# same gate.  3.11 is the oldest interpreter `requires-python` allows.
target-version = "py311"
line-length = 120
src = ["memfo", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# Small, high-signal set: pycodestyle errors, Pyflakes, import sorting,
# pyupgrade and bugbear.  Formatting-only rules are intentionally excluded, so
# `ruff check` never argues about layout this codebase already settled.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
# src pins the measured package no matter which directory pytest is started
# from, so the number the release gate prints is reproducible.
source = ["memfo"]
omit = ["tests/*"]

[tool.coverage.report]
# Measured just above this; the floor is a ratchet against new code arriving
# without a test, not a target to optimise.  Raise it when the number rises.
fail_under = 18
show_missing = true
